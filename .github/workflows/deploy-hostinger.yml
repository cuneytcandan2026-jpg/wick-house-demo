# Builds the site and publishes the finished files to the `hostinger` branch.
# Hostinger (hPanel → Advanced → Git) is connected to that branch and copies it
# into the site's public_html on every push. Its Git deploy has no build step
# of its own, hence this workflow.
name: Build for Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the palette passes WCAG AA
        run: npm run contrast

      - name: Build
        run: npm run build

      - name: Check every page is still marked noindex (demo)
        run: |
          for f in dist/index.html dist/menu/index.html; do
            grep -q 'name="robots" content="noindex' "$f" || { echo "::error::$f is missing noindex"; exit 1; }
          done

      - name: Publish to the hostinger branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin hostinger; then
            git worktree add --detach publish FETCH_HEAD
          else
            git worktree add --detach publish
            git -C publish checkout --orphan hostinger
          fi
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. publish/
          cd publish
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Build from ${GITHUB_SHA::7}"
          git push origin HEAD:hostinger
